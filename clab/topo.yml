name: cs

mgmt:
  network: cs
  ipv4-subnet: 192.168.49.0/24

topology:
  kinds:
    vr-sros:
      type: sr-1
      mgmt-ipv4: 192.168.49.100
      image: vrnetlab/vr-sros:24.3.R2
      startup-config: r1.partial.config
      license: ~/license/sros-license-24.txt
      binds:
        - ../scripts/commit-script:/tftpboot/commit-script
        - ../scripts/validate_commit.py:/tftpboot/validate_commit.py
        - ../scripts/mtu.py:/tftpboot/mtu.py
        - ../scripts/cpm.py:/tftpboot/cpm.py
  nodes:
    r1:
      kind: vr-sros
    tacplus:
      kind: linux
      mgmt-ipv4: 192.168.49.49
      image: henderiw/tacacs-plus-alpine
      ports:
        - 49:49
